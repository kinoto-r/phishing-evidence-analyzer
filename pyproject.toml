[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-evidence-analyzer"
version = "0.1.0"
description = "A local-first tool for safely extracting and structuring evidence from suspicious email files."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "License not yet selected" }

authors = [
    { name = "KINOTO RESEARCH" }
]

keywords = [
    "phishing",
    "email",
    "security",
    "eml",
    "incident-response"
]

dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]